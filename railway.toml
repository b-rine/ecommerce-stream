[build]
builder = "NIXPACKS"

[deploy]
startCommand = "java -jar build/libs/kafka-ecommerce-stream-0.0.1-SNAPSHOT.jar"
healthcheckPath = "/actuator/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
SPRING_PROFILES_ACTIVE = "production"
SERVER_PORT = "8080"
# Railway will provide PORT automatically, but we set a default
PORT = "8080"
